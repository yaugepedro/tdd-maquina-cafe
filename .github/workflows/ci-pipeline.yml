name: CI Pipeline
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
      - name: Configurar entorno Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Compilar proyecto
        run: |
          mkdir -p out
          javac -cp "lib/junit-4.13.2.jar:lib/hamcrest-core-1.3.jar" -d out src/*.java test/*.java
      - name: Ejecutar pruebas
        run: java -cp "out:lib/junit-4.13.2.jar:lib/hamcrest-core-1.3.jar" org.junit.runner.JUnitCore TestSistemaCafe TestVaso